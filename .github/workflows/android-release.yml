# Se ejecuta solo con push a main (o manualmente desde la pestaña Actions).
# Las ramas de trabajo (devlopment, iOS) no disparan builds.
#
# Tiempos: casi toda la build es C++ nativo de las librerias (CMake). ccache
# guarda esos objetos entre ejecuciones; `ccache -s` al final muestra los aciertos.
name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: ccache (C++ nativo)
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: android-ccache
          max-size: 2G

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar APK release
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros
        run: ./gradlew assembleRelease --no-daemon

      - name: Estadisticas de ccache
        if: always()
        run: ccache -s

      - name: Renombrar APK con el commit
        id: apk
        run: |
          NAME="ricemobile-android-${GITHUB_SHA::7}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/$NAME"
          echo "path=android/app/build/outputs/apk/release/$NAME" >> "$GITHUB_OUTPUT"

      - name: Subir APK (sin zip)
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          retention-days: 14
