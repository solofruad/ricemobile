# Compila la app para iOS en un runner macOS de GitHub y genera un .ipa SIN
# firmar como artifact descargable. No se necesita Mac local ni cuenta de
# Apple Developer para esto.
#
# Requisitos:
#   - El repositorio debe ser PUBLICO: los runners macOS son ilimitados y
#     gratuitos solo para repos publicos (en repos privados consumen ~10x
#     minutos del plan gratuito).
#
# El .ipa resultante se instala en un iPhone con AltStore (re-firma con un
# Apple ID gratuito, caduca a los 7 dias y hay que refrescar) o con
# TrollStore, segun la version de iOS del dispositivo.
#
# Que hace el pipeline:
#   1. npm ci (ejecuta postinstall -> patch-package)
#   2. npx expo prebuild -p ios --clean --no-install  (regenera ios/ desde
#      app.json; los plugins re-inyectan el pod RiceNative, los .tflite y
#      model_labels.txt). --no-install: sin esto prebuild ya corre pod install
#      y el paso 3 lo repetia (~5 min perdidos).
#   3. pod install (con cache de descargas de CocoaPods)
#   4. xcodebuild archive sin firma (Release, incluye bundle JS + Hermes)
#   5. Empaqueta el .app en ricemobile-ios-<commit>.ipa y lo sube sin zip
#
# Deteccion de objetos: ambos modelos corren con TensorFlowLiteSwift. No se
# usa MediaPipe en iOS (simbolos TFLite duplicados al enlazar; ver
# RiceNative/RiceNative.podspec).
#
# Se ejecuta solo con push a main (o manualmente desde la pestaña Actions).
# Las ramas de trabajo (devlopment, iOS) no disparan builds.

name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-ios-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS unsigned build (macOS runner)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version de Xcode
        run: xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias JS
        run: npm ci

      - name: Expo prebuild (genera ios/ desde app.json + plugins)
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild -p ios --clean --no-install

      - name: Cache de descargas de CocoaPods
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'RiceNative/RiceNative.podspec', 'app.json', 'plugins/**') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: CocoaPods install
        run: pod install --project-directory=ios

      - name: Resolver workspace y scheme
        id: resolve
        run: |
          WORKSPACE_PATH=$(find ios -maxdepth 1 -type d -name '*.xcworkspace' | head -n 1)
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "No se encontro un .xcworkspace dentro de ios/" >&2
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE_PATH" .xcworkspace)
          echo "workspace=$WORKSPACE_PATH" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Compilar archive (sin firma)
        run: |
          xcodebuild \
            -workspace "${{ steps.resolve.outputs.workspace }}" \
            -scheme "${{ steps.resolve.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Empaquetar IPA (Payload)
        id: ipa
        run: |
          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No se encontro el .app dentro del archive" >&2
            exit 1
          fi
          NAME="ricemobile-ios-${GITHUB_SHA::7}.ipa"
          cd "$(dirname "$APP_PATH")"
          mkdir -p Payload
          cp -R "$(basename "$APP_PATH")" Payload/
          zip -qry "$GITHUB_WORKSPACE/$NAME" Payload
          echo "path=$NAME" >> "$GITHUB_OUTPUT"

      - name: Subir IPA (sin zip)
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.ipa.outputs.path }}
          archive: false
          retention-days: 14
